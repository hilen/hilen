[package]
edition.workspace = true
name = "test-engine"
version.workspace = true

[lib]
#crate-type = ["rlib", "staticlib", "dylib"]
crate-type = ["rlib", "staticlib"]
name = "test_engine"

[features]
bench = []
# The inspect server listens on the network and can edit any view, so it must
# never reach a shipped app by accident. Off unless an app asks for it.
inspect = []
# Registers every `impl ViewTest` into `UI_TESTS`. The switch lives on the proc
# macro, so off means `view` emits no ctor in any crate and a shipped app
# carries none. One switch for the whole graph, so no crate can forget it and
# silently lose its tests.
ui-tests = ["ui-proc/ui-tests"]
webgl = ["wgpu/webgl"]

[dependencies]
anyhow = { workspace = true }
arbitrary = { workspace = true }
atomic_float = { workspace = true }
base64 = { workspace = true }
bit_ops = { workspace = true }
bytemuck = { workspace = true }
chrono = { workspace = true }
contour = { workspace = true }
ctor = { workspace = true }
dirs = { workspace = true }
educe = { workspace = true }
fastrand = { workspace = true }
fern = { workspace = true }
hex = { workspace = true }
image = { workspace = true }
indexmap = { workspace = true }
kira = { workspace = true }
log = { workspace = true }
lyon = { workspace = true }
noise = { workspace = true }
nonempty = { workspace = true }
parking_lot = { workspace = true }
resvg = { workspace = true }
rust_decimal = { workspace = true }
rustybuzz = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tiny-skia = { workspace = true }
usvg = { workspace = true }
web-time = { workspace = true }
wgpu = { workspace = true }
wgpu_text = { workspace = true }

hreads = { workspace = true }
netrun = { workspace = true }
plat = { workspace = true }
reflected = { workspace = true }
refs = { workspace = true }
vents = { workspace = true }

level-proc = { workspace = true }
ui-proc = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mdns-sd = { workspace = true }
rapier2d = { workspace = true, features = ["parallel"] } # simd can crash if there are too many active objects
sentry = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
event-listener = { workspace = true }
# nightly selects the real atomics thread parker, without it parking panics on wasm workers
parking_lot = { workspace = true, features = ["nightly"] }
rapier2d = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = { workspace = true }
jni = { workspace = true }
ndk-context = { workspace = true }
winit = { workspace = true, features = ["android-game-activity"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
winit = { workspace = true }

[target.'cfg(not(any(target_os = "ios", target_os = "tvos", target_os = "android")))'.dependencies]
rfd = { workspace = true }

[target.'cfg(any(target_os = "ios", target_os = "tvos"))'.dependencies]
objc2-foundation = { workspace = true }
objc2-ui-kit = { workspace = true }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "ios", target_os = "tvos", target_os = "android")))'.dependencies]
arboard = { workspace = true }
open = { workspace = true }

[build-dependencies]
plat = { workspace = true }

[dev-dependencies]
serial_test = "3.4"

[lints]
workspace = true
