[package]
authors.workspace = true
description = "Cross platform game engine and UI framework rendering on WGPU."
edition.workspace = true
license.workspace = true
name = "hilen"
readme = "../README.md"
repository.workspace = true
version.workspace = true

[lib]
#crate-type = ["rlib", "staticlib", "dylib"]
crate-type = ["rlib", "staticlib"]
name = "hilen"

[features]
bench = []
# Runtime pointer checks from the vendored `refs`. On by default, the engine
# has always run with them.
checks = []
default = ["checks"]
# The inspect server listens on the network and can edit any view, so it must
# never reach a shipped app by accident. Off unless an app asks for it.
inspect = ["discovery", "dep:if-addrs"]
# Find devices on the local network by the service they announce, see
# `hilen/src/discovery`. The system Bonjour service on macOS, iOS and tvOS,
# mdns-sd on Windows, Linux and Android. Off by default.
discovery = ["dep:mdns-sd"]
# Hot reload on iOS, see docs/hot-reload.md. The app is a dynamic library that
# a loader app starts, the loader owns `UIApplicationMain`. It turns `inspect`
# on, so the release guards of `inspect` keep it out of a shipped app.
hot = ["inspect", "winit/ios-attach"]
# Registers every `impl ViewTest` into `UI_TESTS`. The switch lives on the proc
# macro, so off means `view` emits no ctor in any crate and a shipped app
# carries none. One switch for the whole graph, so no crate can forget it and
# silently lose its tests.
ui-tests = ["ui-proc/ui-tests", "dep:clap"]
# Physics levels and the no physics game scene, with rapier, the level
# proc macro, and the sprite, polygon and background pipelines. Off by
# default, a GUI only app carries none of it.
level = ["dep:geo", "dep:level-proc", "dep:rapier2d"]
# Registers every `impl LevelTest` into `LEVEL_TESTS`. Needs the shared
# runner from `ui-tests`. `ui-tests` never pulls level in.
level-tests = ["level", "ui-tests", "level-proc/level-tests"]
# Sound playback through kira and its decoders. Off by default.
audio = ["dep:kira"]
# MIDI input devices through midir, see docs/midi.md. Off by default.
midi = ["dep:midir"]
# Bluetooth LE devices in the central role, through btleplug and through Web
# Bluetooth in a browser, see the doc of `hilen::bluetooth`. Off by default.
bluetooth = ["dep:btleplug", "dep:uuid"]
# The cameras of the device: the list, a live picture in `CameraView` and a
# photo at full resolution. AVFoundation on macOS and iOS, the NDK camera on
# Android, Media Foundation through nokhwa on Windows, Video for Linux
# through linuxvideo, getUserMedia in a browser. Off by default. A photo is
# encoded with the jpeg codec of `image`, which a browser build has only
# through this feature.
camera = [
  "image/jpeg",
  "dep:futures-channel",
  "dep:dispatch2",
  "dep:linuxvideo",
  "dep:ndk",
  "dep:ndk-sys",
  "dep:nokhwa",
  "dep:objc2-av-foundation",
  "dep:objc2-core-media",
  "dep:objc2-core-video",
]
# Video playback through a prebuilt static ffmpeg, hardware decode through
# VideoToolbox, VAAPI or D3D11VA, sound through kira. Desktop and iOS, in a
# browser through a video element, see docs/video.md. Off by default.
# kira is pulled in, not `audio`: the `sound` cfg of build.rs builds the
# audio module where ffmpeg plays the sound, and a browser build stays
# without it.
video = ["dep:kira", "dep:ffmpeg-next", "dep:objc2-avf-audio"]
# 3D scenes on rapier3d and glam, with the scene proc macro, glTF models and the mesh
# pipeline. Off by default, a GUI only app carries none of it.
scene = ["dep:level-proc", "dep:rapier3d", "dep:glam", "dep:gltf", "dep:futures-channel"]
# Registers every `impl SceneTest` into `SCENE_TESTS`. Needs the shared
# runner from `ui-tests`, the same way `level-tests` does. Deterministic
# rapier and scalar glam so a pinned physics rest lands on the same bits
# on every lane, glam's SIMD sums in another order per architecture. A
# game on `scene` alone keeps the fast path.
scene-tests = ["scene", "ui-tests", "level-proc/scene-tests", "rapier3d/enhanced-determinism", "glam/scalar-math"]

# From the vendored `refs`, both off by default and both diagnostics only.
pointers_info = []
stats = []
webgl = ["wgpu/webgl"]
# Google and Apple login against a `hilen-server` backend, the two login button
# views and the encrypted `SessionStore`. A release with this on needs `HILEN_SESSION_KEY`
# at build time. Off by default, an app with no accounts carries none of it.
login = ["dep:hilen-session", "dep:getrandom", "dep:qrcode"]
# Google API access with the tokens kept on the device, against the
# `google_access` routes of a `hilen-server` backend, and `SecretStore`, a
# secret in the credential store of the system. Off by default.
google-access = ["secrets", "hilen-session/device-key", "dep:getrandom"]
# `SecretStore` alone, a secret in the credential store of the system, also one
# shared with the widget extension of an iOS app. Off by default.
secrets = ["dep:hilen-session", "hilen-session/keychain"]

