[package]
authors.workspace = true
description = "Cross platform game engine and UI framework rendering on WGPU."
edition.workspace = true
license.workspace = true
name = "hilen"
readme = "../README.md"
repository.workspace = true
version.workspace = true

[lib]
#crate-type = ["rlib", "staticlib", "dylib"]
crate-type = ["rlib", "staticlib"]
name = "hilen"

[features]
bench = []
# Runtime pointer checks from the vendored `refs`. On by default, the engine
# has always run with them.
checks = []
default = [
  "bug-report",
  "checks",
  "code-colors",
  "font-roboto",
  "font-roboto-italic",
  "font-roboto-mono",
  "font-symbols",
  "gpu",
  "infisical",
  "net",
  "noise",
  "system-info",
  "updater",
]
# The window, the drawers, the render pipelines, the app loop, wgpu and
# winit. On by default. A crate of shared views turns it off and builds its
# views with no GPU, the app that links it brings the window.
gpu = [
  "dep:bit_ops",
  "dep:fern",
  "dep:indexmap",
  "dep:pollster",
  "dep:wgpu",
  "dep:wgpu_text",
  "dep:wgpu-hal",
  "dep:winit",
]
# The parts of the engine that are no UI. All on by default, so an app sees no
# change. A crate of shared views turns the defaults off and depends on the
# UI alone, the app that links it brings the rest.
#
# Requests over http and websockets, `hilen::net`, downloaded pictures and
# fonts, and the asset groups of a browser build, which load over the network.
# A browser build needs it.
net = [
  "dep:data-encoding",
  "dep:futures-util",
  "dep:local-ip-address",
  "dep:reqwest",
  "dep:ring",
  "dep:rustls",
  "dep:tokio-tungstenite",
  "dep:webpki-roots",
]
# Bug reports and crash reports to Sentry, `hilen::bug_report`.
bug-report = ["gpu", "net", "system-info", "dep:os_info", "dep:sentry"]
# Secrets read from Infisical, `hilen::net::SecretsManager`.
infisical = ["dep:infisical"]
# The host, the system, the cores and the memory, `System::get_info`.
system-info = ["dep:byte-unit", "dep:sysinfo"]
# Self update of a desktop app, `hilen::updater` and `system::Updater`.
updater = ["gpu", "dep:hilen-updater"]
# Syntax colors of code, `CodeHighlighter` and the code blocks of
# `MarkdownView`. Without it code is drawn in 1 color.
code-colors = ["dep:syntect", "dep:two-face"]
# The diff of 1 file, `DiffPanel`, on the data of the `filediff` crate,
# which apps also get as `hilen::filediff`. See docs/diff-view.md.
diff-view = ["code-colors", "dep:filediff"]
# Formulas typed as text drawn as graphs, `GraphView` and `graphs`. A 3D
# graph needs `scene` too, without it `graphs` answers with an error for
# one. See docs/formula-plot.md.
plot = ["dep:exmex", "dep:num-complex"]
# Terrain from noise, `hilen::generate`.
noise = ["dep:contour", "dep:noise"]
# The Roboto files the engine brings, 1 feature per file, so an app with its
# own fonts can leave a file out, see docs/text.md. Without `font-roboto` the
# app gives its fallback font to `Font::set_builtin`.
font-roboto = []
font-roboto-italic = []
font-roboto-mono = []
# Stars, check marks, arrows, shapes and key symbols, about 100 KB, a char
# the label font lacks falls back to them, in a browser too, see docs/text.md.
font-symbols = []
# LaTeX math in `MarkdownView` and `MathView`, drawn with Latin Modern Math,
# a 730 KB font file. Without it a formula shows as its text.
math = []
# The inspect server listens on the network and can edit any view, so it must
# never reach a shipped app by accident. Off unless an app asks for it.
# The frame record packs its frames as QOI, which the browser build leaves out
# of its image formats.
inspect = ["gpu", "discovery", "dep:hex", "dep:if-addrs", "dep:wasm_thread", "image/qoi"]
# A worker thread of an atomics wasm build starts as an ES module, for a page
# whose own script is a module, like the one trunk builds by default. A page
# with a classic script, like a packaged webOS app, needs classic workers,
# Chromium 79 starts no module worker at all.
module-workers = ["wasm_thread?/es_modules"]
# Find devices on the local network by the service they announce, see
# `hilen/src/discovery`. The system Bonjour service on macOS, iOS and tvOS,
# mdns-sd on Windows, Linux and Android. Off by default.
discovery = ["dep:mdns-sd"]
# Hot reload on iOS, see docs/hot-reload.md. The app is a dynamic library that
# a loader app starts, the loader owns `UIApplicationMain`. It turns `inspect`
# on, so the release guards of `inspect` keep it out of a shipped app.
hot = ["inspect", "winit/ios-attach"]
# Registers every `impl ViewTest` into `UI_TESTS`. The switch lives on the proc
# macro, so off means `view` emits no ctor in any crate and a shipped app
# carries none. One switch for the whole graph, so no crate can forget it and
# silently lose its tests.
ui-tests = ["gpu", "ui-proc/ui-tests", "dep:clap", "dep:wasm_thread"]
# Physics levels and the no physics game scene, with rapier, the level
# proc macro, and the sprite, polygon and background pipelines. Off by
# default, a GUI only app carries none of it.
level = ["gpu", "dep:geo", "dep:level-proc", "dep:rapier2d"]
# Registers every `impl LevelTest` into `LEVEL_TESTS`. Needs the shared
# runner from `ui-tests`. `ui-tests` never pulls level in.
level-tests = ["level", "ui-tests", "level-proc/level-tests"]
# Sound playback through kira and its decoders. Off by default.
audio = ["dep:kira"]
# MIDI input devices through midir, see docs/midi.md. Off by default.
midi = ["dep:midir"]
# Bluetooth LE devices in the central role, through btleplug and through Web
# Bluetooth in a browser, see the doc of `hilen::bluetooth`. Off by default.
bluetooth = ["dep:btleplug", "dep:futures-util", "dep:uuid"]
# The cameras of the device: the list, a live picture in `CameraView` and a
# photo at full resolution. AVFoundation on macOS and iOS, the NDK camera on
# Android, Media Foundation through nokhwa on Windows, Video for Linux
# through linuxvideo, getUserMedia in a browser. Off by default. A photo is
# encoded with the jpeg codec of `image`, which a browser build has only
# through this feature.
camera = [
  "gpu",
  "image/jpeg",
  "dep:futures-channel",
  "dep:dispatch2",
  "dep:linuxvideo",
  "dep:ndk",
  "dep:ndk-sys",
  "dep:nokhwa",
  "dep:objc2-av-foundation",
  "dep:objc2-core-media",
  "dep:objc2-core-video",
]
# Speech to text from the microphone, see docs/speech.md. The microphone
# through cpal and the streaming and offline recognizers of sherpa-onnx, on
# macOS, iOS, Windows and Linux. Android and a browser answer that they have
# none yet. Off by default, an app with no speech links neither.
speech = ["net", "dep:cpal", "dep:sherpa-onnx", "dep:objc2-avf-audio"]
# A check of the finger or the face of the user, Touch ID and Face ID
# through LocalAuthentication on macOS and iOS, see docs/biometric.md.
# Every other system answers that the device cannot. Off by default.
biometric = ["dep:futures-channel", "dep:objc2-local-authentication"]
# A key combination that works in every app while the app runs, through
# global-hotkey. macOS now, the other systems answer with an error, see
# docs/global-keys.md. Off by default.
global-keys = ["dep:global-hotkey"]
# A picture of every screen and the Screen Recording permission, through
# xcap. macOS now, the other systems answer with an error, see
# docs/screen-capture.md. Off by default.
screen-capture = ["gpu", "dep:xcap"]
# Remote notifications from APNs on iOS, the permission, the device token
# and the tap on a push, see docs/push.md. Every other system answers that
# it has no push. Off by default, an app with no push links no
# UserNotifications and no call to register for it.
push = ["dep:futures-channel", "dep:hex", "dep:objc2-user-notifications"]
# Actions the system runs in the app, like a sentence said to Siri, see
# docs/intents.md. iOS only for now, the Swift comes from the [[intent]]
# tables of hilen.toml.
intents = []
# Video playback through a prebuilt static ffmpeg, hardware decode through
# VideoToolbox, VAAPI or D3D11VA, sound through kira. Desktop and iOS, in a
# browser through a video element, see docs/video.md. Off by default.
# kira is pulled in, not `audio`: the `sound` cfg of build.rs builds the
# audio module where ffmpeg plays the sound, and a browser build stays
# without it.
video = ["gpu", "dep:kira", "dep:ffmpeg-next", "dep:objc2-avf-audio"]
# 3D scenes on rapier3d and glam, with the scene proc macro, glTF models and the mesh
# pipeline. Off by default, a GUI only app carries none of it.
scene = ["gpu", "dep:level-proc", "dep:rapier3d", "dep:glam", "dep:gltf", "dep:futures-channel", "dep:half"]
# Registers every `impl SceneTest` into `SCENE_TESTS`. Needs the shared
# runner from `ui-tests`, the same way `level-tests` does. Deterministic
# rapier and scalar glam so a pinned physics rest lands on the same bits
# on every lane, glam's SIMD sums in another order per architecture. A
# game on `scene` alone keeps the fast path.
# VR through OpenXR, the running scene in a headset with its controllers,
# see the doc of `hilen::xr`. SteamVR on Windows through DX12, every other system
# answers that VR is not there.
xr = ["scene", "dep:openxr", "dep:windows"]
scene-tests = ["scene", "ui-tests", "level-proc/scene-tests", "rapier3d/enhanced-determinism", "glam/scalar-math"]

# From the vendored `refs`, both off by default and both diagnostics only.
pointers_info = []
stats = []
webgl = ["gpu", "wgpu/webgl"]
# Google and Apple login against a `hilen-server` backend, the two login button
# views and the encrypted `SessionStore`. A release with this on needs `HILEN_SESSION_KEY`
# at build time. Off by default, an app with no accounts carries none of it.
login = ["net", "dep:hilen-session", "dep:getrandom", "dep:hex", "dep:qrcode", "dep:sha2"]
# Google API access with the tokens kept on the device, against the
# `google_access` routes of a `hilen-server` backend, and `SecretStore`, a
# secret in the credential store of a phone. Off by default.
google-access = ["net", "secrets", "hilen-session/device-key", "dep:getrandom", "dep:hex", "dep:sha2"]
# `SecretStore` alone, a secret in the credential store of a phone and in a
# sealed file on desktop, also one shared with the widget extension of an iOS
# app. Off by default.
secrets = ["dep:hilen-session", "hilen-session/keychain"]

