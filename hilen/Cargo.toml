[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
btleplug = { workspace = true, optional = true }
fontdb = { workspace = true }
image = { workspace = true, features = ["default-formats", "gif", "png"] }
resvg = { workspace = true, features = ["default"] }
usvg = { workspace = true, features = ["default"] }
memmap2 = { workspace = true }
getrandom = { workspace = true, optional = true }
if-addrs = { workspace = true, optional = true }
infisical = { workspace = true }
rapier2d = { workspace = true, optional = true } # simd can crash if there are too many active objects
rapier3d = { workspace = true, optional = true }
pollster = { workspace = true }
rustls = { workspace = true }
sentry = { workspace = true }
sys-locale = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
webpki-roots = { workspace = true }

# macOS, iOS and tvOS announce and browse through the system Bonjour service.
[target.'cfg(not(any(target_arch = "wasm32", target_vendor = "apple")))'.dependencies]
mdns-sd = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
axum = { workspace = true }
mdns-sd = { workspace = true }
hilen-server = { workspace = true }
rcgen = { workspace = true }
tokio-rustls = { workspace = true }

# Everything that runs on rayon. Its global pool has no shutdown, and a hot
# build that is stopped must leave no thread, see docs/hot-reload.md. A hot
# build is compiled with `--cfg hilen_hot`, which takes these lines out.
[target.'cfg(not(hilen_hot))'.dependencies]
image = { workspace = true, features = ["rayon"] }

[target.'cfg(all(not(target_arch = "wasm32"), not(hilen_hot)))'.dependencies]
rapier2d = { workspace = true, optional = true, features = ["parallel"] }
rapier3d = { workspace = true, optional = true, features = ["parallel"] }

# A browser decodes downloaded pictures and bundled jpegs itself, the engine
# decodes only bundled png and gif. The page also draws every svg, so no svg
# crate and no jpeg decoder is linked, see window/image/late.rs. An LG C1
# compiles wasm at about 2.3 s a MB with Liftoff, see docs/webos.md.
[target.'cfg(target_arch = "wasm32")'.dependencies]
image = { workspace = true, features = ["gif", "png"] }
console_error_panic_hook = { workspace = true }
console_log = { workspace = true }
getrandom = { workspace = true, optional = true, features = ["wasm_js"] }
gloo-timers = { workspace = true }
# nightly selects the real atomics thread parker, without it parking panics on wasm workers
parking_lot = { workspace = true, features = ["nightly"] }
rapier2d = { workspace = true, optional = true }
rapier3d = { workspace = true, optional = true }
spin = { workspace = true }
sys-locale = { workspace = true, features = ["js"] }
wasm-bindgen-futures = { workspace = true }
wasm_thread = { workspace = true }
web-sys = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = { workspace = true }
jni = { workspace = true }
libc = { workspace = true }
ndk = { workspace = true, optional = true }
ndk-context = { workspace = true }
ndk-sys = { workspace = true, optional = true }
winit = { workspace = true, features = ["android-game-activity"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
