
[workspace]

default-members = ["demo"]
members = [
  "bench",
  "demo",
  "demo-android",
  "deps/plat",
  "deps/ui-proc-test",
  "example-app",
  "fuzz",
  "hilen",
  "hilen-inspect",
  "hilen-pixdiff",
  "hilen-server",
  "inspector",
  "render-test",
  "ui-test",
  "ui-test-suite",
]

resolver = "3"

[workspace.package]
authors = ["Vladas Zakrevskis <146100@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/hilen/hilen"
version = "0.1.0"

[workspace.metadata.cargo-machete]
ignored = []

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

module_name_repetitions = "allow"
explicit_deref_methods = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
missing_safety_doc = "allow"
format_push_string = "allow"
new_without_default = "allow"
must_use_candidate = "allow"
module_inception = "allow"
needless_pass_by_value = "allow"
unnecessary_box_returns = "allow"
return_self_not_must_use = "allow"
struct_field_names = "allow"
manual_assert = "allow"

[workspace.dependencies]
android_logger = "0.15"
anyhow = "1.0"
arbitrary = { version = "1.4", features = ["derive"] }
arboard = "3.6"
async-std = "1.13"
atomic_float = "1.1"
axum = "0.8"
base64 = "0.22"
bit_ops = "0.2"
byte-unit = "5.2"
bytemuck = { version = "1.25", features = ["derive"] }
cgmath = "0.18"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
console_error_panic_hook = "0.1"
console_log = "1.0"
contour = { version = "0.13", features = ["f32"] }
ctor = "1.0"
dirs = "6.0"
dotenvy = "0.15"
ed25519-dalek = "3.0"
educe = "0.6"
env_logger = "0.11"
event-listener = "5.4"
fake = "5.1"
fastrand = "2.4"
fern = "0.7"
gloo-timers = { version = "0.4", features = ["futures"] }
futures-util = "0.3"
getrandom = "0.4"
hex = "0.4"
image = "0.25"
indexmap = "2.14"
infisical = "0.0.3"
instant = { version = "0.1", features = ["wasm-bindgen"] }
http-body-util = "0.1"
jni = "0.22"
kira = "0.12"
local-ip-address = "0.6"
log = "0.4"
lyon = "1.0"
mdns-sd = "0.20"
mime_guess = "2.0"
ndk-context = "0.1"
noise = "0.9"
nonempty = "0.12"
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", features = ["CGWindow"] }
objc2-foundation = { version = "0.3", features = ["NSDictionary", "NSException", "NSString", "NSURL"] }
objc2-ui-kit = { version = "0.3", features = ["UIApplication", "UIPasteboard", "block2"] }
open = "5.4"
parking_lot = "0.12"
paste = "1.0"
pollster = "0.4"
pretty_assertions = "1.4"
quote = "1.0"
rapier2d = { version = "0.33" }
redis = { version = "1.6", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
resvg = "0.47"
rfd = "0.17"
rust-embed = "8.12"
rust_decimal = "1.42"
rustc-hash = "2.1"
rustls = "0.23"
rustybuzz = "0.20"
self-replace = "1.5"
semver = "1.0"
sentry = { version = "0.48", default-features = false, features = [
  "backtrace",
  "contexts",
  "debug-images",
  "panic",
  "reqwest",
  "rustls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serial_test = "3.4"
sha2 = "0.11"
spin = "0.9"
sqlx = { version = "0.9", features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "macros",
  "chrono",
  "uuid",
] }
syn = { version = "2.0", features = ["extra-traits", "full"] }
sysinfo = "0.39"
test-log = "0.2"
thiserror = "2.0"
tiny-skia = "0.12"
tokio = { version = "1.52", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
usvg = "0.47"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
wasm_thread = "0.3"
web-sys = { version = "0.3", features = [
    "Clipboard",
    "CloseEvent",
    "Document",
    "History",
    "Location",
    "MessageEvent",
    "Navigator",
    "Node",
    "Url",
    "WebSocket",
    "Window",
    "XmlHttpRequest",
] }
web-time = "1.1"
webpki-roots = "1.0"
wgpu = { package = "hilen-wgpu", version = "30.0" }
wgpu_text = { package = "hilen-wgpu-text", git = "https://github.com/VladasZ/wgpu-text", rev = "dc6217091bdb9456eee7e3e32ac49c57d04f243c" }
winit = { package = "hilen-winit", version = "0.30", features = ["serde"] }

plat = { version = "0.10", path = "deps/plat" }
reflected = "0.30"

level-proc = { version = "0.1", path = "deps/level-proc" }
hilen = { version = "0.1", path = "hilen" }
demo = { path = "demo" }
ui-test-suite = { path = "ui-test-suite" }
ui-proc = { version = "0.1", path = "deps/ui-proc" }

# Image decoding dominates dev build startup, a debug decode of the
# asset fixtures takes ten seconds in the browser. Decoders are leaf
# crates that never need debugging here, so dev builds them optimized.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.adler2]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

# Text shaping and rasterizing. Unoptimized, a label of a few hundred glyphs
# costs tens of milliseconds a frame and a typing test crawls at 15 fps.
[profile.dev.package.rustybuzz]
opt-level = 3

[profile.dev.package.ttf-parser]
opt-level = 3

[profile.dev.package.ab_glyph]
opt-level = 3

[profile.dev.package.ab_glyph_rasterizer]
opt-level = 3

[profile.dev.package.glyph_brush]
opt-level = 3

[profile.dev.package.glyph_brush_layout]
opt-level = 3

[profile.dev.package.glyph_brush_draw_cache]
opt-level = 3

[profile.dev.package.hilen-wgpu-text]
opt-level = 3
