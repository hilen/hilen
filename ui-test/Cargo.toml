[package]
edition.workspace = true
version.workspace = true

name = "ui-test"

[[bin]]
name = "ui-test"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
log = { workspace = true }

hilen = { workspace = true, features = ["inspect", "ui-tests"] }
demo = { workspace = true }
ui-test-suite = { workspace = true }

[lints]
workspace = true

# The video test lane, macOS only for now, see docs/video.md.
[target.'cfg(target_os = "macos")'.dependencies]
hilen = { workspace = true, features = ["video"] }
ui-test-suite = { workspace = true, features = ["video"] }
