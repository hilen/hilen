[package]
edition.workspace = true
version.workspace = true

name = "ui-test"

[[bin]]
name = "ui-test"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }

hilen = { workspace = true, features = ["inspect", "login", "ui-tests"] }
demo = { workspace = true }
ui-test-suite = { workspace = true }

[lints]
workspace = true

# The video test lane, macOS and Windows for now, see docs/video.md.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
hilen = { workspace = true, features = ["video"] }
ui-test-suite = { workspace = true, features = ["video"] }
