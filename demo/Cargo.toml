[package]
authors = ["Vladas Zakrevskis <146100@gmail.com>"]
edition.workspace = true
name = "demo"
version.workspace = true

[[bin]]
name = "demo"

[lib]
crate-type = ["rlib", "staticlib"]
name = "demo"

[features]
default = []

webgl = ["hilen/webgl"]

# Compiles in the UI benchmark (benchmark_view, its system-load guard and GPU
# timing). Off in shipped builds. `make bench` builds demo with it.
bench = ["dep:sysinfo", "dep:serde_json", "hilen/bench"]

[dependencies]
anyhow = { workspace = true }
fake = { workspace = true }
fastrand = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
sysinfo = { workspace = true, optional = true }

hilen = { workspace = true, features = ["audio", "inspect", "level", "ui-tests"] }
ui-test-suite = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dotenvy = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[build-dependencies]
plat = { workspace = true }

[lints]
workspace = true
