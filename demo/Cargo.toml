[package]
authors = ["Vladas Zakrevskis <146100@gmail.com>"]
edition.workspace = true
name = "demo"
version.workspace = true

[[bin]]
name = "demo"

[lib]
crate-type = ["rlib", "staticlib"]
name = "demo"

[features]
default = ["scene"]

# The 3D page, its scene and the scene tests. A build with it off has no 3D
# code at all, for a device too weak for it like an LG TV.
scene = ["dep:scene-test-suite", "hilen/scene", "hilen/scene-tests"]

webgl = ["hilen/webgl"]

# Compiles in the UI benchmark (benchmark_view, its system-load guard and GPU
# timing). Off in shipped builds. `make bench` builds demo with it.
bench = ["dep:sysinfo", "dep:serde_json", "hilen/bench"]

[dependencies]
anyhow = { workspace = true }
fake = { workspace = true }
fastrand = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
sysinfo = { workspace = true, optional = true }

hilen = { workspace = true, features = ["audio", "inspect", "level", "ui-tests"] }
scene-test-suite = { workspace = true, optional = true }
ui-test-suite = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dotenvy = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[build-dependencies]
plat = { workspace = true }

[lints]
workspace = true

# Video is desktop only, on macOS and Windows so far, see docs/video.md. The
# page and its UI test follow the feature.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
hilen = { workspace = true, features = ["video"] }
ui-test-suite = { workspace = true, features = ["video"] }
