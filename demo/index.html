<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Hilen, a cross platform game engine and UI framework in Rust on WGPU. Live demo." />
        <meta name="color-scheme" content="light dark" />
        <base data-trunk-public-url />
        <link data-trunk rel="inline" href="../build/web/boot.js" />
        <link data-trunk rel="rust" data-bin="demo" />
        <link data-trunk rel="copy-dir" href="../assets" data-target="assets" />
        <title>Hilen</title>
        <style type="text/css">
            body {
                margin: 0;
                background: #f5f7fc;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    background: #0d0f17;
                }
            }
            canvas {
                display: block;
                width: 100vw;
                height: 100vh;
                /* A phone counts its browser bars into 100vh, so the bottom of the
                   page sat under the bar. 100dvh is the height that shows now. */
                height: 100dvh;
            }
            canvas:focus {
                outline: none;
            }
            #fallback {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: system-ui, sans-serif;
                color: #8b97a8;
            }
        </style>
    </head>
    <body>
        <div id="fallback">The Hilen demo needs a browser with WebGPU or WebGL.</div>
    </body>
</html>
