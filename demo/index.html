<html lang="en">
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Hilen, a cross platform game engine and UI framework in Rust on WGPU. Live demo." />
        <meta name="color-scheme" content="light dark" />
        <base data-trunk-public-url />
        <link data-trunk rel="rust" data-bin="demo" />

        <title>Hilen</title>
        <style type="text/css">

            canvas {
