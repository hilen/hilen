server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    gzip on;
    gzip_types application/wasm application/javascript text/css application/json image/svg+xml;

    # Hashed trunk outputs never change under one name.
    location ~* \.(wasm|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every page path is a Router path inside the app, index.html serves them all.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
