name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3

      # clippy builds the whole workspace several times over.
      - name: Free disk space
        run: uv run -q --no-dev build/scripts/free_action_runner.py

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev xorg-dev libxcb1-dev \
            libasound2-dev libdbus-1-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libvulkan-dev

      - name: Install quality tools
        uses: taiki-e/install-action@v2
        with:
          tool: typos-cli@1.48.0,cargo-machete@0.9.2

      - name: Run quality checks
        run: make ci

  wasm:
    name: Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          submodules: recursive

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build
        run: make wasm

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Free disk space
        run: uv run -q --no-dev build/scripts/free_action_runner.py

      # mesa-vulkan-drivers is lavapipe, the software Vulkan the headless
      # runner draws with on a machine with no GPU.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev xorg-dev libxcb1-dev \
            libasound2-dev libdbus-1-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers

      - name: Run UI tests
        run: cargo run -p ui-test -- --headless

  # A real installed browser, headed as the driver wants, but drawing into a
  # virtual display, so a run never opens a window on anyone's desktop.
  web-ui-tests:
    name: Web UI Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          submodules: recursive

      - uses: oven-sh/setup-bun@v2

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers

      - name: Browser version
        run: ${{ matrix.browser == 'chrome' && 'google-chrome --version' || 'firefox --version' }}

      - name: Run UI tests in ${{ matrix.browser }}
        # The screen must fit the browser window the driver opens, which is
        # sized for the biggest test canvas. See WINDOW_HEIGHT in drive.ts.
        run: xvfb-run -a --server-args="-screen 0 1600x1500x24" make ui-web BROWSER=${{ matrix.browser }}

      - name: Upload failure screenshot and browser log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-failure-${{ matrix.browser }}
          path: target/web-test/
          if-no-files-found: ignore

  ios-ui-tests:
    name: iOS UI Tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          submodules: recursive

      # The Xcode of the work macs. Without the simulator list of the account
      # the storyboard compiler fails with "iOS 26.2 Platform Not Installed".
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          sudo xcodebuild -runFirstLaunch
          xcodebuild -runFirstLaunch -checkForNewerComponents || true
          ls ~/Library/Developer/Xcode/SDKToSimulatorIndexMapping.plist

      # The lane runs on an iPhone 8, which needs the iOS 16.4 runtime, and no
      # image of GitHub has it. Apple serves it with no Apple ID, the first
      # request only gives the download cookie.
      - name: Add the iOS 16.4 simulator runtime
        run: |
          dmg="$RUNNER_TEMP/ios-16.4.dmg"
          path=/Developer_Tools/iOS_16.4_Simulator_Runtime/iOS_16.4_Simulator_Runtime.dmg
          curl -sfL -c "$RUNNER_TEMP/apple.jar" -o /dev/null \
            "https://developerservices2.apple.com/services/download?path=$path"
          curl -sfL -b "$RUNNER_TEMP/apple.jar" -o "$dmg" "https://download.developer.apple.com$path"
          xcrun simctl runtime add "$dmg"
          rm "$dmg"
          xcrun simctl runtime list

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Run UI tests on the iOS simulator
        run: uv run -q --no-dev ./build/ios/sim-test.py

      - name: Upload failure pictures and the helper log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-failures
          path: |
            target/ios/failures/
            target/ios/system-input.log
          if-no-files-found: ignore

  build:
    name: Build (${{ matrix.target.os }})
    strategy:
      fail-fast: false
      matrix:
        target: [
            { os: macos, runner: macos-26 },
            { os: windows, runner: windows-latest },

            { os: ios, runner: macos-26 },
            { os: android, runner: ubuntu-latest },
          ]
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Free disk space
        if: ${{ matrix.target.os == 'android' }}
        run: uv run -q --no-dev build/scripts/free_action_runner.py

      # The Xcode of the work macs, see the iOS UI tests above.
      - name: Select Xcode
        if: ${{ matrix.target.os == 'ios' }}
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          sudo xcodebuild -runFirstLaunch
          xcodebuild -runFirstLaunch -checkForNewerComponents || true
          ls ~/Library/Developer/Xcode/SDKToSimulatorIndexMapping.plist

      - name: Build and test
        if: ${{ matrix.target.os != 'windows' }}
        run: uv run -q --no-dev build/build.py ${{ matrix.target.os }}

      - name: Build and test Windows
        if: ${{ matrix.target.os == 'windows' }}
        run: uv run -q --no-dev build/build.py

  linux:
    name: Build Linux
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            { container: "ubuntu" },
            { container: "debian" },
            { container: "fedora" },
            { container: "archlinux" },
            { container: "amazonlinux" },
            { container: "dockerscripts/linuxmint:cinnamon-minimal" },
          ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          submodules: recursive

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Free disk space
        run: uv run -q --no-dev build/scripts/free_action_runner.py

      - name: Build
        run: echo ${{ matrix.target.container }} && uv run -q --no-dev build/in_docker.py ${{ matrix.target.container }}
