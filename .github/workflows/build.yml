name: Build

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev xorg-dev libasound2-dev

      - name: Install quality tools
        uses: taiki-e/install-action@v2
        with:
          tool: typos-cli@1.48.0,cargo-machete@0.9.2

      - name: Run quality checks
        run: make ci

  wasm:
    name: Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          submodules: recursive

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build
        run: make wasm

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev xorg-dev libasound2-dev \
            mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev mesa-vulkan-drivers

      - name: Run UI tests
        run: cargo run -p ui-test --profile=ci -- --headless

  # A real installed browser, headed as the driver wants, but drawing into a
  # virtual display, so a run never opens a window on anyone's desktop.
  web-ui-tests:
    name: Web UI Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          submodules: recursive

      - uses: oven-sh/setup-bun@v2

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers

      - name: Browser version
        run: ${{ matrix.browser == 'chrome' && 'google-chrome --version' || 'firefox --version' }}

      - name: Run UI tests in ${{ matrix.browser }}
        # The screen must fit the browser window the driver opens, which is
        # sized for the biggest test canvas. See WINDOW_HEIGHT in drive.ts.
        run: xvfb-run -a --server-args="-screen 0 1600x1500x24" make ui-web BROWSER=${{ matrix.browser }}

      - name: Upload failure screenshot and browser log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-ui-failure-${{ matrix.browser }}
          path: target/web-test/
          if-no-files-found: ignore

  ios-ui-tests:
    name: iOS UI Tests
    runs-on: mac
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          submodules: recursive

      - name: Setup rustscript
        uses: VladasZ/rustscript@v0.1

      - name: Run UI tests on the iOS simulator
        run: rust ./build/ios/sim-test.rs

  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        target: [
            { os: macos, runner: macos-latest },
            { os: windows, runner: windows-latest },

            { os: ios, runner: mac },
            { os: android, runner: ubuntu-latest },
          ]
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          submodules: recursive

      - name: Setup rustscript
        uses: VladasZ/rustscript@v0.1

      - name: Free Space
        if: ${{ matrix.target.os != 'windows' }}
        run: rust build/scripts/free_action_runner.rs

      - name: Build and test
        if: ${{ matrix.target.os != 'windows' }}
        run: rust build/build.rs ${{ matrix.target.os }}

      - name: Build and test Windows
        if: ${{ matrix.target.os == 'windows' }}
        run: rust build/build.rs

  linux:
    name: Build Linux
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            { container: "ubuntu" },
            { container: "debian" },
            { container: "fedora" },
            { container: "archlinux" },
            { container: "amazonlinux" },
            { container: "dockerscripts/linuxmint:cinnamon-minimal" },
          ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          submodules: recursive

      - name: Setup rustscript
        uses: VladasZ/rustscript@v0.1

      - name: Free Space
        run: rust build/scripts/free_action_runner.rs

      - name: Build
        run: echo ${{ matrix.target.container }} && rust build/in_docker.rs ${{ matrix.target.container }}
